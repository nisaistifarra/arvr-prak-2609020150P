<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 1 - Scene Pertama</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head> 
<body>
    <a-scene>
        <a-box position="-2 0.5 -3" rotation="0 45 0" color="#FF9C69" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-box>
        <a-sphere position="0 1.25 -5" radius="1.25" color="#ED42A0"></a-sphere>
        <a-cylinder position="-1.5 1 -4" radius="0.5" height="1.5" color="#851B34"></a-cylinder>
        <a-cone position="2 0.75 -3" radius="0.5" height="1.5" color="#E6B865"></a-cone>
        <a-torus position="1.5 0.75 -4" radius="0.5" tube="0.1" color="#3D2E0F" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-torus>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="6" height="6" color="#ADEEFF"></a-plane>
        <a-sky color="#DCFCF2"></a-sky>
    </a-scene>
</body>
</html>
